<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fast Note Sync 剪藏设置</title><link rel="stylesheet" href="options.css"></head><body><main><h1>Fast Note Sync 剪藏设置</h1><p>连接你的 Fast Note Sync 服务后，即可从浏览器右键菜单或工具栏剪藏网页。</p><label>服务地址<input id="serverUrl" type="url" placeholder="https://notes.example.com"></label><label>Authorization Token<input id="token" type="password" placeholder="登录后获得的 Token"></label><label>默认 Vault<input id="defaultVault" type="text" placeholder="例如：MyVault"></label><label>默认文件夹<input id="folder" type="text" value="Clips" placeholder="例如：Clips"></label><button id="save">保存设置</button><span id="status"></span><h2>安装</h2><ol><li>打开 Chrome 的 <code>chrome://extensions</code>。</li><li>开启右上角“开发者模式”，点击“加载已解压的扩展程序”。</li><li>选择项目中的 <code>browser-extension</code> 文件夹。</li></ol></main><script src="options.js"></script></body></html>
